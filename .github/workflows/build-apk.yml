name: Universal Android APK Builder

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: 'Nama proyek aplikasi'
        required: false
        default: 'app'
      build_mode:
        description: 'Mode build APK (debug atau release)'
        required: false
        default: 'debug'

permissions:
  contents: write
  actions: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK (Native Runner SDK)
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_DIR" ]; then
            echo "Android SDK bawaan tidak ditemukan di $SDK_DIR!"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          CMDLINE_BIN="$(find "$SDK_DIR/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -n "$CMDLINE_BIN" ]; then
            echo "$(dirname "$CMDLINE_BIN")" >> "$GITHUB_PATH"
            yes | "$CMDLINE_BIN" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
          fi
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"
          echo "Android SDK Ready: $SDK_DIR"

      - name: Extract & Normalize Source Payload
        run: |
          mkdir -p "$RUNNER_TEMP/work_src"
          if [ -f "source_payload.zip" ]; then
            unzip -q -o "source_payload.zip" -d "$RUNNER_TEMP/work_src"
          else
            echo "File source_payload.zip tidak ditemukan di repositori!"
            exit 1
          fi

          cd "$RUNNER_TEMP/work_src"
          rm -rf __MACOSX .DS_Store

          while [ "$(find . -mindepth 1 -maxdepth 1 ! -name '.*' | wc -l)" -eq 1 ] && [ "$(find . -mindepth 1 -maxdepth 1 -type d ! -name '.*' | wc -l)" -eq 1 ]; do
            SUBDIR="$(find . -mindepth 1 -maxdepth 1 -type d ! -name '.*')"
            shopt -s dotglob nullglob
            mv "$SUBDIR"/* .
            rmdir "$SUBDIR"
          done

          echo "=== Struktur Root Proyek ==="
          ls -la

      - name: Build APK (Auto-Detect Gradle / Flutter / Capacitor / Web HTML)
        env:
          BUILD_MODE: ${{ github.event.inputs.build_mode || 'debug' }}
        run: |
          cd "$RUNNER_TEMP/work_src"
          mkdir -p "$RUNNER_TEMP/apk_out"

          MODE_LOWER="$(echo "${BUILD_MODE:-debug}" | tr '[:upper:]' '[:lower:]')"
          if [ "$MODE_LOWER" = "release" ]; then
            GRADLE_TASK="assembleRelease"
            FLUTTER_FLAG="--release"
          else
            MODE_LOWER="debug"
            GRADLE_TASK="assembleDebug"
            FLUTTER_FLAG="--debug"
          fi
          echo ">>> Mode Build APK: ${MODE_LOWER} (Task: ${GRADLE_TASK}) <<<"

          if [ -f "pubspec.yaml" ]; then
            echo ">>> Mendeteksi Proyek Flutter <<<"
            git clone --depth 1 -b stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
            export PATH="$RUNNER_TEMP/flutter/bin:$PATH"
            flutter config --no-analytics
            flutter pub get
            if [ ! -d "android" ]; then
              flutter create .
            fi
            flutter build apk $FLUTTER_FLAG
            find build/app/outputs -name "*.apk" -exec cp {} "$RUNNER_TEMP/apk_out/" \;

          elif [ -f "package.json" ] && [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
            echo ">>> Mendeteksi Proyek Node / Web / Capacitor <<<"
            npm install --legacy-peer-deps || true
            if [ -f "ionic.config.json" ] || grep -q '"build"' package.json; then
              npm run build || true
            fi
            if [ ! -d "android" ]; then
              WEB_DIR="dist"
              [ ! -d "$WEB_DIR" ] && [ -d "build" ] && WEB_DIR="build"
              [ ! -d "$WEB_DIR" ] && [ -d "www" ] && WEB_DIR="www"
              if [ ! -d "$WEB_DIR" ]; then
                mkdir -p www_auto
                find . -maxdepth 1 -type f \( -name "*.html" -o -name "*.js" -o -name "*.css" -o -name "*.png" -o -name "*.jpg" \) -exec cp {} www_auto/ \;
                WEB_DIR="www_auto"
              fi
              npm install @capacitor/core @capacitor/cli @capacitor/android --no-save
              npx cap init "${{ github.event.inputs.project_name || 'App' }}" "com.builder.app" --web-dir "$WEB_DIR" || true
              npx cap add android || true
            fi
            npx cap sync android || true
            cd android
            rm -f local.properties
            echo "sdk.dir=$ANDROID_HOME" > local.properties
            chmod +x gradlew || true
            sed -i 's/\r$//' gradlew 2>/dev/null || true
            ./gradlew $GRADLE_TASK --no-daemon --stacktrace
            find . -path "*/outputs/apk/*.apk" -exec cp {} "$RUNNER_TEMP/apk_out/" \;

          elif [ -f "index.html" ] && [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ] && [ ! -d "app" ]; then
            echo ">>> Mendeteksi Proyek HTML5 Murni -> Membungkus jadi WebView APK <<<"
            mkdir -p www_app
            find . -mindepth 1 -maxdepth 1 ! -name "www_app" -exec cp -r {} www_app/ \;
            npm init -y
            npm install @capacitor/core @capacitor/cli @capacitor/android
            npx cap init "${{ github.event.inputs.project_name || 'WebApp' }}" "com.webview.autapk" --web-dir www_app
            npx cap add android
            npx cap copy android
            cd android
            rm -f local.properties
            echo "sdk.dir=$ANDROID_HOME" > local.properties
            chmod +x gradlew
            ./gradlew $GRADLE_TASK --no-daemon
            find . -path "*/outputs/apk/*.apk" -exec cp {} "$RUNNER_TEMP/apk_out/" \;

          else
            echo ">>> Mendeteksi Proyek Android Gradle <<<"
            if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ] && [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
              FOUND_GRADLE="$(find . -maxdepth 2 \( -name "settings.gradle*" -o -name "build.gradle*" \) | head -n 1)"
              if [ -n "$FOUND_GRADLE" ]; then
                cd "$(dirname "$FOUND_GRADLE")"
              fi
            fi

            rm -f local.properties
            echo "sdk.dir=$ANDROID_HOME" > local.properties

            if [ -f "gradlew" ]; then
              sed -i 's/\r$//' gradlew || true
              chmod +x gradlew
            fi

            TARGET_GRADLE="8.11.1"
            if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
              PROP_VER="$(grep -oE 'gradle-[0-9]+\.[0-9]+(\.[0-9]+)?' gradle/wrapper/gradle-wrapper.properties | head -n 1 | sed 's/^gradle-//')"
              if [ -n "$PROP_VER" ]; then
                TARGET_GRADLE="$PROP_VER"
              fi
            fi

            if [ ! -f "gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
              echo ">>> Menyiapkan Gradle Wrapper versi $TARGET_GRADLE <<<"
              gradle wrapper --gradle-version "$TARGET_GRADLE" || gradle wrapper --gradle-version 8.11.1 || true
              [ -f "gradlew" ] && chmod +x gradlew
            fi

            run_gradle_build() {
              if [ -f "gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
                ./gradlew $GRADLE_TASK --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle_build.log"
                return ${PIPESTATUS[0]}
              else
                gradle $GRADLE_TASK --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle_build.log"
                return ${PIPESTATUS[0]}
              fi
            }

            if ! run_gradle_build; then
              REQ_VER="$(grep -oE 'Minimum supported Gradle version is [0-9]+\.[0-9]+(\.[0-9]+)?' "$RUNNER_TEMP/gradle_build.log" | tail -n 1 | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?')"
              if [ -n "$REQ_VER" ]; then
                echo ">>> AGP meminta Gradle minimal versi $REQ_VER — otomatis upgrade wrapper & retry! <<<"
                if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
                  sed -i -E "s|gradle-[0-9]+\.[0-9]+(\.[0-9]+)?-(all|bin)\.zip|gradle-${REQ_VER}-bin.zip|g" gradle/wrapper/gradle-wrapper.properties
                else
                  gradle wrapper --gradle-version "$REQ_VER" || true
                fi
                [ -f "gradlew" ] && chmod +x gradlew
                run_gradle_build
              else
                exit 1
              fi
            fi

            find . -path "*/outputs/apk/*.apk" -exec cp {} "$RUNNER_TEMP/apk_out/" \;
            if [ -z "$(ls -A "$RUNNER_TEMP/apk_out/")" ]; then
              find . -name "*.apk" -exec cp {} "$RUNNER_TEMP/apk_out/" \;
            fi
          fi

          if [ -z "$(ls -A "$RUNNER_TEMP/apk_out/")" ]; then
            echo "Gagal menemukan file APK hasil build!"
            exit 1
          fi

          if [ "$MODE_LOWER" = "release" ]; then
            echo ">>> Memeriksa & Menandatangani (Auto-Sign) APK Release <<<"
            SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
            BT_DIR="$(ls -d "$SDK_DIR"/build-tools/* 2>/dev/null | sort -V | tail -n 1)"
            ZIPALIGN_BIN="$BT_DIR/zipalign"
            APKSIGNER_BIN="$BT_DIR/apksigner"
            KEYSTORE_PATH="$RUNNER_TEMP/release_auto.jks"

            if [ -x "$APKSIGNER_BIN" ]; then
              for APK_FILE in "$RUNNER_TEMP/apk_out"/*.apk; do
                [ -f "$APK_FILE" ] || continue
                if "$APKSIGNER_BIN" verify "$APK_FILE" >/dev/null 2>&1; then
                  echo "APK sudah tertanda tangan: $(basename "$APK_FILE")"
                  continue
                fi
                if [ ! -f "$KEYSTORE_PATH" ]; then
                  keytool -genkeypair -v -keystore "$KEYSTORE_PATH" -storepass android123 -keypass android123 -alias releasekey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Release, OU=Dev, O=AutoBuilder, L=ID, ST=ID, C=ID"
                fi
                BASE_NAME="$(basename "$APK_FILE" .apk)"
                BASE_NAME="${BASE_NAME%-unsigned}"
                ALIGNED_APK="$RUNNER_TEMP/${BASE_NAME}-aligned.apk"
                SIGNED_APK="$RUNNER_TEMP/apk_out/${BASE_NAME}-signed.apk"
                if [ -x "$ZIPALIGN_BIN" ]; then
                  "$ZIPALIGN_BIN" -f -p 4 "$APK_FILE" "$ALIGNED_APK"
                else
                  cp "$APK_FILE" "$ALIGNED_APK"
                fi
                "$APKSIGNER_BIN" sign --ks "$KEYSTORE_PATH" --ks-key-alias releasekey --ks-pass pass:android123 --key-pass pass:android123 --out "$SIGNED_APK" "$ALIGNED_APK"
                "$APKSIGNER_BIN" verify "$SIGNED_APK"
                rm -f "$APK_FILE" "$ALIGNED_APK" "$RUNNER_TEMP/apk_out"/*.idsig
                echo "APK Release berhasil di-sign: $(basename "$SIGNED_APK")"
              done
            else
              echo "Peringatan: apksigner tidak ditemukan di $BT_DIR, melewati auto-sign."
            fi
          fi

          ls -lh "$RUNNER_TEMP/apk_out/"

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: compiled-apk
          path: ${{ runner.temp }}/apk_out/*.apk
          if-no-files-found: error
          retention-days: 7
